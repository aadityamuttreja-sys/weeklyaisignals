name: Publish on merge

on:
  push:
    branches: [main]
    paths:
      - "content/drafts/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Promote drafts to published issues
        run: npx tsx scripts/prepublish.ts

      - name: Commit promoted issue(s)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: publish drafts [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
